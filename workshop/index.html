<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创意工坊 - 十三工作室</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230a0a14'/><text x='32' y='46' text-anchor='middle' font-family='Arial' font-size='28' font-weight='900' fill='%23f0f'>⚒</text></svg>">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0a14;
    color: #e0e0e0;
    min-height: 100vh;
}
.container { max-width: 1000px; margin:0 auto; padding:0 24px; }
header {
    padding: 20px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}
.header-inner {
    max-width: 1000px; margin:0 auto; padding:0 24px;
    display:flex; align-items:center; justify-content:space-between;
}
.logo a { color: #a78bfa; font-size:18px; font-weight:900; text-decoration:none; letter-spacing:2px; }

.hero { text-align:center; padding:80px 0 48px; }
.hero h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight:900; letter-spacing:8px; margin-bottom:12px; }
.hero p { color: #666; font-size:15px; }

.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; padding-bottom:80px; }
.card {
    display:flex; flex-direction:column;
    background: #111120;
    border:1px solid rgba(255,255,255,0.06);
    border-radius:16px; padding:28px; cursor:pointer;
    transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
    text-decoration:none; color:inherit;
}
.card:hover {
    transform: translateY(-4px);
    border-color: rgba(167,139,250,0.3);
    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
}
.card-icon { font-size:40px; margin-bottom:20px; }
.card-name { font-size:18px; font-weight:700; margin-bottom:8px; color:#e0e0e0; }
.card-desc { font-size:13px; color:#666; line-height:1.6; }
.card-tag {
    display:inline-block; margin-top:16px;
    font-size:11px; padding:3px 10px; border-radius:10px;
    border:1px solid rgba(167,139,250,0.3); color:#a78bfa;
}
footer { text-align:center; padding:24px 0; border-top:1px solid rgba(255,255,255,0.04); color:#444; font-size:12px; }
</style>
</head>
<body>
<header>
    <div class="header-inner">
        <span class="logo"><a href="http://" id="hub-link">XIII Studio</a></span>
    </div>
</header>

<section class="hero">
    <h1>创意工坊</h1>
    <p>十三工作室 · 创意小程序集合</p>
</section>

<div class="container">
    <div class="grid">
        <a class="card" href="debate-timer.html">
            <div class="card-icon">⏱️</div>
            <div class="card-name">辩论计时器</div>
            <div class="card-desc">辩论赛计时工具。支持校园赛/银卡赛模板、双方计时、奇袭、自动切换环节，键盘快捷键操控。</div>
            <span class="card-tag">辩论工具</span>
        </a>
        <a class="card" href="天文科普-太阳系demo.html">
            <div class="card-icon">🪐</div>
            <div class="card-name">天文科普 · 太阳系</div>
            <div class="card-desc">交互式太阳系模拟。探索行星轨道、公转关系，直观了解太阳系结构。</div>
            <span class="card-tag">科普互动</span>
        </a>
        <a class="card" href="pretty-buttons.html">
            <div class="card-icon">⌨️</div>
            <div class="card-name">Pretty Buttons</div>
            <div class="card-desc">按下键盘任意按键，屏幕绽放彩色粒子光效。可调节粒子大小、速度、拖尾等参数。</div>
            <span class="card-tag">键盘交互</span>
        </a>
    </div>
</div>

<footer>十三工作室 · 创意工坊</footer>

<script>
document.getElementById('hub-link').href = 'http://' + window.location.hostname;
</script>
</body>
</html>
