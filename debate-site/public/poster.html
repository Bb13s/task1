<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华中科技大学物理学院辩论队 · 招新海报</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #e8ddd0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .poster {
    width: 600px;
    min-height: 860px;
    background: #fefaf5;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(44,24,16,0.15);
  }

  .poster::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.35;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(196,148,58,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 55%, rgba(158,27,50,0.04) 0%, transparent 50%),
      radial-gradient(circle at 50% 80%, rgba(196,148,58,0.05) 0%, transparent 40%);
    pointer-events: none;
  }

  .corner {
    position: absolute; width: 24px; height: 24px;
    opacity: 0.5; pointer-events: none;
  }
  .corner.tl { top: 28px; left: 28px; border-top: 1.5px solid #c4943a; border-left: 1.5px solid #c4943a; }
  .corner.br { bottom: 28px; right: 28px; border-bottom: 1.5px solid #c4943a; border-right: 1.5px solid #c4943a; }

  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 44px 40px 36px;
    height: 860px;
  }

  /* ── 1. 标题 ── */
  .title-block {
    display: flex; flex-direction: column;
    gap: 6px;
  }

  .title-cn {
    font-family: Georgia, "Times New Roman", "宋体", SimSun, serif;
    font-size: 30px;
    font-weight: bold;
    color: #2c1810;
    letter-spacing: 0.1em;
    line-height: 1.5;
  }

  .title-en {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 12px;
    color: #8b7355;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  .title-divider {
    width: 32px;
    height: 1.5px;
    background: linear-gradient(90deg, #9e1b32, #c4943a);
    opacity: 0.5;
  }

  /* ── 2. 标语 ── */
  .slogan-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .slogan-line {
    width: 48px; height: 1px;
    background: rgba(196,148,58,0.35);
  }

  .slogan-diamond {
    width: 5px; height: 5px;
    background: #c4943a;
    transform: rotate(45deg);
    opacity: 0.5;
  }

  .slogan-text {
    font-family: Georgia, "Times New Roman", "宋体", SimSun, serif;
    font-size: 18px;
    color: #c4943a;
    letter-spacing: 0.3em;
    white-space: nowrap;
  }

  /* ── 3. QR 码（放大） ── */
  .qr-block {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .qr-frame {
    width: 220px; height: 220px;
    padding: 8px;
    border: 3px solid #9e1b32;
    outline: 1.5px solid #c4943a;
    outline-offset: 4px;
    background: #fffbf7;
  }

  .qr-frame img {
    width: 100%; height: 100%;
    object-fit: contain;
  }

  .qr-hint {
    font-family: Georgia, "Times New Roman", "宋体", SimSun, serif;
    font-size: 12px;
    color: #8b7355;
    letter-spacing: 0.15em;
  }

  /* ── 4. 招新大字 ── */
  .recruit-badge {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .recruit-word {
    font-family: Georgia, "Times New Roman", "宋体", SimSun, serif;
    font-size: 56px;
    font-weight: bold;
    color: #9e1b32;
    letter-spacing: 0.25em;
    line-height: 1;
  }

  .recruit-sub {
    font-size: 16px;
    color: #3d2c24;
    letter-spacing: 0.06em;
    line-height: 1.8;
    text-align: center;
  }

  .recruit-sub .hl {
    color: #9e1b32;
    font-weight: 600;
  }

  /* ── 5. 底部信息 ── */
  .footer-info {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .footer-line {
    font-family: Georgia, "Times New Roman", "宋体", SimSun, serif;
    font-size: 13px;
    color: #8b7355;
    letter-spacing: 0.12em;
  }

  .bottom-accent {
    width: 48px;
    height: 1.5px;
    background: linear-gradient(90deg, #9e1b32, #c4943a);
    opacity: 0.35;
  }
</style>
</head>
<body>

<div class="poster">
  <div class="corner tl"></div>
  <div class="corner br"></div>

  <div class="content">

    <!-- 标题 -->
    <div class="title-block">
      <div class="title-cn">
        华中科技大学<br>
        物理学院辩论队
      </div>
      <div class="title-divider"></div>
      <div class="title-en">HUST &middot; Physics Debate Team</div>
    </div>

    <!-- 标语 -->
    <div class="slogan-row">
      <div class="slogan-line"></div>
      <div class="slogan-diamond"></div>
      <span class="slogan-text">辩以明物，论以穷理</span>
      <div class="slogan-diamond"></div>
      <div class="slogan-line"></div>
    </div>

    <!-- QR 码 -->
    <div class="qr-block">
      <div class="qr-frame">
        <img src="./30631245521340d9.png" alt="网站二维码">
      </div>
      <div class="qr-hint">扫码访问官网 · 了解更多</div>
    </div>

    <!-- 招新 -->
    <div class="recruit-badge">
      <div class="recruit-word">招 新</div>
      <p class="recruit-sub">
        用逻辑<span class="hl">拆解</span>世界，<br>
        用表达<span class="hl">传递</span>思考。
      </p>
    </div>

    <!-- 底部 -->
    <div class="footer-info">
      <div class="footer-line">物院辩论队 · 等你入队</div>
      <div class="bottom-accent"></div>
    </div>

  </div>
</div>

</body>
</html>
