{% extends "base.html" %}
{% block title %}辩论 AI - 小B{% endblock %}

{% block content %}
<!-- ── 设置页面 ── -->
<div id="setup-screen" class="screen">
    <div class="setup-card">
        <div class="setup-avatar">B</div>
        <h1>辩论 AI</h1>
        <p class="subtitle">选好模式，开始对练</p>

        <!-- 模式选择 -->
        <div class="mode-cards" id="mode-cards">
            <div class="mode-card active" data-mode="chat">
                <div class="mode-icon">💬</div>
                <div class="mode-name">闲聊</div>
                <div class="mode-desc">跟小B随便聊聊</div>
            </div>
            <div class="mode-card" data-mode="free">
                <div class="mode-icon">⚔</div>
                <div class="mode-name">自由辩论</div>
                <div class="mode-desc">选辩题立场对练</div>
            </div>
        </div>

        <!-- 表单 -->
        <div class="setup-fields">
            <div class="form-group">
                <label>你的名字</label>
                <input type="text" id="user-name" placeholder="输入你的名字" value="">
            </div>

            <div id="debate-fields" style="display:none">
                <div class="form-group">
                    <label>辩题</label>
                    <input type="text" id="motion" value="" placeholder="输入辩题">
                </div>
                <div class="form-group">
                    <label>你的立场</label>
                    <div class="side-selector">
                        <button class="side-btn active" data-side="正方">正方</button>
                        <button class="side-btn" data-side="反方">反方</button>
                    </div>
                </div>
            </div>
        </div>

        <button id="start-btn" class="btn-primary">开始对话</button>
    </div>
</div>

<!-- ── 辩论页面 ── -->
<div id="debate-screen" class="screen" style="display:none">
    <div class="debate-container">
        <!-- 顶栏 -->
        <div class="debate-header">
            <div class="header-left">
                <div class="header-avatar">B</div>
                <div>
                    <div class="header-name" id="header-name">小B</div>
                    <div class="header-mode" id="header-mode">闲聊</div>
                </div>
            </div>
            <div class="header-right">
                <button class="btn-sm" id="back-btn">返回</button>
                <a href="/admin" class="btn-sm">管理</a>
                <button class="btn-sm" id="feedback-btn">点评</button>
                <button class="btn-sm btn-danger" id="end-btn">结束</button>
            </div>
        </div>

        <!-- 消息区 -->
        <div class="messages" id="messages">
            <div class="system-msg">连接中...</div>
        </div>

        <!-- 输入区 -->
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="输入消息..." autocomplete="off">
            <button class="send-btn" id="send-btn" title="发送">↑</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/chat.js?v=3"></script>
{% endblock %}
